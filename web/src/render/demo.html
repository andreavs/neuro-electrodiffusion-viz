<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render toolkit demo</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #111216; color: #e8e9ee; font-family: system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr 180px; height: 100%; gap: 8px; padding: 8px; box-sizing: border-box; }
      #view { width: 100%; height: 100%; display: block; min-height: 0; }
      #side { display: flex; flex-direction: column; gap: 8px; }
      #plot { grid-column: 1 / -1; width: 100%; height: 100%; color: #c8cad4; }
      #stats { position: fixed; top: 12px; left: 12px; font: 12px ui-monospace, monospace; background: #000a; padding: 6px 8px; border-radius: 6px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="side"></div>
      <canvas id="plot"></canvas>
    </div>
    <div id="stats"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
